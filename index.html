<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruksa Global Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #060913;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* ==========================================================================
       1. LOGIN VIEW
       ========================================================================== */
    #loginView {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at 10% 20%, #172554, transparent 40%),
                  radial-gradient(circle at 90% 80%, #1e1b4b, transparent 40%),
                  #030712;
      position: relative;
      z-index: 10;
    }

    .login-card {
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      width: 100%;
      max-width: 420px;
      padding: 2.75rem 2.25rem;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: -0.5px;
      color: #60a5fa;
      margin-bottom: 1.25rem;
    }

    .brand-mark span {
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      color: #ffffff;
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(37, 99, 235, 0.5);
    }

    .login-header h2 {
      color: #f8fafc;
      font-size: 1.65rem;
      font-weight: 700;
    }

    .login-header p {
      color: #94a3b8;
      font-size: 0.88rem;
      margin-top: 0.35rem;
      margin-bottom: 1.5rem;
    }

    .demo-hint {
      background: rgba(30, 58, 138, 0.3);
      border: 1px dashed rgba(96, 165, 250, 0.4);
      color: #93c5fd;
      padding: 0.65rem 0.85rem;
      border-radius: 10px;
      font-size: 0.8rem;
      margin-bottom: 1.25rem;
      line-height: 1.45;
    }

    .demo-hint code {
      color: #ffffff;
      font-weight: 700;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1.25rem;
      font-size: 0.85rem;
      display: none;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      color: #cbd5e1;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .input-wrapper {
      position: relative;
    }

    .form-group input {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      font-size: 0.95rem;
      color: #ffffff;
      outline: none;
      transition: all 0.2s;
    }

    .form-group input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .btn-toggle-pw {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
      transition: all 0.2s;
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 15px 25px -5px rgba(37, 99, 235, 0.6);
    }

    /* ==========================================================================
       2. VISUALLY ENHANCED LANDING PAGE
       ========================================================================== */
    #landingPage {
      display: none;
      width: 100%;
      min-height: 100vh;
      position: relative;
      flex-direction: column;
      background: #030712;
      overflow: hidden;
    }

    /* Background Ambient Canvas & Neon Orbs */
    #particleCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .ambient-glow {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 1;
      animation: floatGlow 10s ease-in-out infinite alternate;
    }

    .glow-1 {
      top: 10%;
      left: 15%;
      background: #2563eb;
    }

    .glow-2 {
      bottom: 10%;
      right: 15%;
      background: #7c3aed;
      animation-delay: -5s;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.15); }
    }

    /* Navigation */
    .landing-nav {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 1.5rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
    }

    .landing-nav .brand-mark {
      margin-bottom: 0;
      color: #ffffff;
    }

    .btn-logout {
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.6rem 1.4rem;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.5);
      color: #ffffff;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
    }

    /* Stage Presentation */
    .landing-content {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .stage-card {
      position: relative;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 4.5rem 3.5rem;
      max-width: 820px;
      width: 100%;
      text-align: center;
      box-shadow: 0 35px 70px -15px rgba(0, 0, 0, 0.8),
                  inset 0 1px 1px rgba(255, 255, 255, 0.2);
      animation: stageEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes stageEntrance {
      from { opacity: 0; transform: scale(0.93) translateY(30px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Live Status Pill */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(14, 165, 233, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #7dd3fc;
      padding: 0.45rem 1.1rem;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .ping-circle {
      position: relative;
      width: 9px;
      height: 9px;
    }

    .ping-circle::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #38bdf8;
      border-radius: 50%;
      animation: radar 1.8s infinite cubic-bezier(0, 0, 0.2, 1);
    }

    .ping-circle::after {
      content: '';
      position: absolute;
      top: 1px;
      left: 1px;
      width: 7px;
      height: 7px;
      background: #0284c7;
      border-radius: 50%;
    }

    @keyframes radar {
      0% { transform: scale(0.9); opacity: 1; }
      100% { transform: scale(2.6); opacity: 0; }
    }

    /* Main Welcome Title */
    .welcome-title {
      font-size: 3.4rem;
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1.15;
      color: #f8fafc;
      margin-bottom: 2.25rem;
    }

    .welcome-title .glow-text {
      background: linear-gradient(135deg, #60a5fa 20%, #38bdf8 60%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.4));
    }

    /* Laser-Border Highlight Banner */
    .highlight-card {
      position: relative;
      background: linear-gradient(135deg, rgba(30, 58, 138, 0.35), rgba(15, 23, 42, 0.7));
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 18px;
      padding: 2rem 2.25rem;
      box-shadow: 0 0 35px rgba(37, 99, 235, 0.25), inset 0 0 15px rgba(56, 189, 248, 0.1);
      overflow: hidden;
    }

    /* Shimmer effect traversing across the banner */
    .highlight-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent 30%,
        rgba(255, 255, 255, 0.08) 50%,
        transparent 70%
      );
      transform: rotate(30deg);
      animation: shimmerFlow 5s linear infinite;
    }

    @keyframes shimmerFlow {
      0% { transform: translateX(-100%) rotate(30deg); }
      100% { transform: translateX(100%) rotate(30deg); }
    }

    .highlight-text {
      position: relative;
      font-size: 1.55rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.4;
      letter-spacing: 0.5px;
      text-shadow: 0 0 18px rgba(56, 189, 248, 0.6);
      word-break: break-word;
    }

    @media (max-width: 640px) {
      .welcome-title { font-size: 2.2rem; }
      .highlight-text { font-size: 1.15rem; }
      .stage-card { padding: 3rem 1.5rem; }
      .landing-nav { padding: 1.25rem 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- =========================================================================
       1. LOGIN COMPONENT
       ========================================================================= -->
  <div id="loginView">
    <div class="login-card">
      <div class="brand-mark">
        <span>R</span> Ruksa Global
      </div>

      <div class="login-header">
        <h2>Account Sign In</h2>
        <p>Enter your details below to access your workspace</p>
      </div>

      <div class="demo-hint">
        <strong>Demo Credentials:</strong><br />
        Email: <code>admin@ruksaglobal.com</code><br />
        Password: <code>Admin@123</code>
      </div>

      <div id="loginError" class="alert-error"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@company.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="••••••••" required />
            <button type="button" class="btn-toggle-pw" id="togglePassword">Show</button>
          </div>
        </div>

        <button type="submit" class="btn-submit">Sign In</button>
      </form>
    </div>
  </div>

  <!-- =========================================================================
       2. VISUALLY ATTRACTIVE LANDING PAGE
       ========================================================================= -->
  <div id="landingPage">
    <!-- Animated Stars/Constellation Canvas -->
    <canvas id="particleCanvas"></canvas>

    <!-- Ambient Glow Orbs -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <!-- Minimal Modern Navbar -->
    <nav class="landing-nav">
      <div class="brand-mark">
        <span>R</span> Ruksa Global
      </div>
      <button type="button" class="btn-logout" id="logoutBtn">Sign Out</button>
    </nav>

    <!-- Glass Presentation Stage -->
    <main class="landing-content">
      <div class="stage-card">
        
        <div class="status-pill">
          <span class="ping-circle"></span>
          Priority Channel Active
        </div>

        <h1 class="welcome-title">
          Welcome to <br />
          <span class="glow-text">Ruksa Global</span>
        </h1>

        <div class="highlight-card">
          <p class="highlight-text">
            Will connect with you soon!!!!!!!!!!!!!!!!!!!!!!!!!!!!
          </p>
        </div>

      </div>
    </main>
  </div>

  <!-- =========================================================================
       3. SCRIPT: AUTH + CANVAS ENGINE
       ========================================================================= -->
  <script>
    const DEMO_CREDENTIALS = {
      email: "admin@ruksaglobal.com",
      password: "Admin@123"
    };

    const loginView = document.getElementById("loginView");
    const landingPage = document.getElementById("landingPage");
    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");
    const passwordInput = document.getElementById("password");
    const togglePasswordBtn = document.getElementById("togglePassword");
    const logoutBtn = document.getElementById("logoutBtn");

    // Toggle Password Visibility
    togglePasswordBtn.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      togglePasswordBtn.textContent = isPassword ? "Hide" : "Show";
    });

    // Handle Login
    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      loginError.style.display = "none";

      const enteredEmail = document.getElementById("email").value.trim();
      const enteredPassword = document.getElementById("password").value;

      if (
        enteredEmail.toLowerCase() === DEMO_CREDENTIALS.email.toLowerCase() &&
        enteredPassword === DEMO_CREDENTIALS.password
      ) {
        loginView.style.display = "none";
        landingPage.style.display = "flex";
        initParticles(); // Boot up visual particles
      } else {
        loginError.textContent = "Invalid email or password. Please use the demo credentials.";
        loginError.style.display = "block";
      }
    });

    // Handle Logout
    logoutBtn.addEventListener("click", () => {
      landingPage.style.display = "none";
      loginView.style.display = "flex";
      loginForm.reset();
      passwordInput.type = "password";
      togglePasswordBtn.textContent = "Show";
    });

    /* ==========================================================================
       CONSTELLATION PARTICLE SYSTEM (CANVAS)
       ========================================================================== */
    function initParticles() {
      const canvas = document.getElementById("particleCanvas");
      const ctx = canvas.getContext("2d");
      let width, height, particles;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }

      window.addEventListener("resize", resize);
      resize();

      particles = [];
      const count = Math.floor((width * height) / 18000);

      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.45,
          vy: (Math.random() - 0.5) * 0.45,
          radius: Math.random() * 1.5 + 0.5,
          alpha: Math.random() * 0.5 + 0.3
        });
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);

        // Render nodes & connecting links
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 0) p.x = width;
          if (p.x > width) p.x = 0;
          if (p.y < 0) p.y = height;
          if (p.y > height) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(147, 197, 253, ${p.alpha})`;
          ctx.fill();

          for (let j = i + 1; j < particles.length; j++) {
            const p2 = particles[j];
            const dx = p.x - p2.x;
            const dy = p.y - p2.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 110) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = `rgba(56, 189, 248, ${0.15 * (1 - dist / 110)})`;
              ctx.lineWidth = 0.75;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(draw);
      }
      draw();
    }
  </script>
</body>
</html>
